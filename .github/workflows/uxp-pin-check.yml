# Guard that every place pinning the UXP (Crossplane) chart version agrees:
# the management cluster's ArgoCD app, the pre-install in every pair
# vcluster (Composition), the solo pre-install (Taskfile) and the version
# the modules quote. See scripts/check-uxp-pins.sh and #229.
name: UXP pin check

on:
  pull_request:
    paths:
      - "gitops/apps/crossplane.yaml"
      - "gitops/crossplane-config/composition.yaml"
      - "Taskfile.yml"
      - "docs/docs/**/*.mdx"
      - "scripts/check-uxp-pins.sh"
      - ".github/workflows/uxp-pin-check.yml"
  push:
    branches: [main]
    paths:
      - "gitops/apps/crossplane.yaml"
      - "gitops/crossplane-config/composition.yaml"
      - "Taskfile.yml"
      - "docs/docs/**/*.mdx"
      - "scripts/check-uxp-pins.sh"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # yq v4 (mikefarah) is preinstalled on GitHub's ubuntu-latest image.
      - name: Check UXP pins agree
        run: scripts/check-uxp-pins.sh
