# Helm values for the argo/argo-cd chart.
# Kept minimal on purpose — ingress/TLS/DNS/SSO are deferred (see PLAN.md).
#
# The ApplicationSet controller is required so the participant-vclusters
# ApplicationSet works.

global:
  domain: argocd.local

configs:
  params:
    # Phase 1 port-forward runs TLS-terminated on the server; keep defaults.
    server.insecure: false
  # No `cm.resource.exclusions` override here, deliberately.
  #
  # This file used to carry the chart's whole default exclusion list
  # with `Pod` appended, as a workaround for argoproj/argo-cd#26529:
  # kubectl v0.34.0 (vendored by every released Argo CD v3.2–v3.4)
  # panicked with `assignment to entry in nil map` inside
  # `populatePodInfo` — notably on clusters where a remote vcluster
  # uses LimitRanges, i.e. exactly this workshop's shape. Excluding
  # Pod from the application-controller's cluster cache skipped the
  # panicking code path, at the cost of per-pod cards in the UI and
  # per-pod aggregation in Application health.
  #
  # That issue closed 2026-10-08, and the chart version pinned in
  # Taskfile.yml (10.11.1 -> app v3.5.6) vendors `k8s.io/kubectl`
  # v0.37.0, past the v0.36.0 threshold the fix landed in
  # (kubernetes/kubernetes#136534). So the workaround is gone.
  #
  # The override is dropped entirely rather than just losing its Pod
  # entry: the remainder was byte-identical to the chart default (and
  # that default is unchanged between 9.5.0 and 10.11.1), so keeping
  # it would only reintroduce the maintenance trap the old comment
  # warned about — Helm string overrides replace rather than merge, so
  # a copied list has to be re-mirrored on every chart bump. Letting
  # the chart's own default apply removes that obligation.

server:
  extraArgs:
    - --insecure=false

applicationSet:
  enabled: true

controller:
  replicas: 1

repoServer:
  replicas: 1

redis:
  enabled: true
