apiVersion: v1
kind: Namespace
metadata:
  name: docs
---
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: validator
  namespace: docs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: validator-solo
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: validator-solo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: validator-solo
subjects:
- kind: ServiceAccount
  name: validator
  namespace: docs
---
apiVersion: v1
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {"rootDirectory": "/var/lib/registry", "gc": true},
      "http": {"address": "0.0.0.0", "port": "5000", "compat": ["docker2s2"]},
      "log": {"level": "info"}
    }
kind: ConfigMap
metadata:
  name: zot-config
  namespace: registry
---
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: docs
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: docs
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: zot
  namespace: registry
spec:
  clusterIP: 10.43.0.50
  ports:
  - name: http
    nodePort: 30511
    port: 5000
    targetPort: http
  selector:
    app: zot
  type: NodePort
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot-data
  namespace: registry
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: docs
  name: docs
  namespace: docs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docs
  template:
    metadata:
      labels:
        app: docs
    spec:
      containers:
      - image: ghcr.io/riccap/crossplane-workshop-docs:latest
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 30
        name: docs
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
      - env:
        - name: VALIDATOR_SOLO
          value: "1"
        image: ghcr.io/riccap/crossplane-workshop-validator:latest
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-validator
          initialDelaySeconds: 5
          periodSeconds: 30
        name: validator
        ports:
        - containerPort: 8081
          name: http-validator
        readinessProbe:
          httpGet:
            path: /healthz
            port: http-validator
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
      serviceAccountName: validator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: zot
  name: zot
  namespace: registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zot
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: zot
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - serve
        - /etc/zot/config.json
        image: ghcr.io/project-zot/zot:v2.1.22@sha256:96cda11459ce6f8c60da3b03f03e9f67fd11b3ae2d82c4c04c92b3c608996080
        name: zot
        ports:
        - containerPort: 5000
          name: http
        readinessProbe:
          httpGet:
            path: /v2/
            port: http
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/zot
          name: config
          readOnly: true
        - mountPath: /var/lib/registry
          name: data
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: zot-config
        name: config
      - name: data
        persistentVolumeClaim:
          claimName: zot-data
      - emptyDir: {}
        name: tmp
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: workshop
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
  - allowedRoutes:
      namespaces:
        from: All
    name: http
    port: 80
    protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: team-local
  namespace: default
spec:
  parentRefs:
  - name: workshop
    namespace: envoy-gateway-system
    sectionName: http
  rules:
  - backendRefs:
    - name: backend
      port: 5678
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /api
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /team/local/api
  - backendRefs:
    - name: frontend
      port: 80
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          replacePrefixMatch: /
          type: ReplacePrefixMatch
    matches:
    - path:
        type: PathPrefix
        value: /team/local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docs
  namespace: docs
spec:
  parentRefs:
  - name: workshop
    namespace: envoy-gateway-system
    sectionName: http
  rules:
  - backendRefs:
    - name: docs
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
