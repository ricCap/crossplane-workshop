apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docs
  namespace: docs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docs
  # Two so the docs site and the wall survive losing a node.
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
