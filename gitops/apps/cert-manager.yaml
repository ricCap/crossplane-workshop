# cert-manager for automated Let's Encrypt TLS certificates.
# Uses the HTTP-01 challenge solver via Envoy Gateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: workshop
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
        config:
          enableGatewayAPI: true
        replicaCount: 1
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        # No `hostAliases` here, deliberately — reverted to the
        # pre-workshop state (c393e41 added it, this removes it).
        #
        # That workaround pinned the two workshop hostnames to the
        # Envoy proxy ClusterIP because cert-manager's HTTP-01
        # self-check was timing out, and it was diagnosed on workshop
        # day as broken hairpin NAT on Aruba's load balancer. Hairpin
        # is not broken: measured on the rebuilt cluster, a Pod
        # co-located with an Envoy replica reaches
        # https://platform-crossplane…/ through the external IP in 5ms.
        #
        # The real cause was the Envoy Service's default
        # `externalTrafficPolicy: Local`, which only forwards external-IP
        # traffic on nodes running an Envoy Pod. The first cluster was
        # single-node, so every Pod qualified and the setting was
        # invisible; the symptom looked exactly like hairpin failure.
        # That is now fixed at the source by the EnvoyProxy in
        # gitops/envoy-gateway/envoyproxy.yaml, so cert-manager needs
        # no per-Pod override and no longer carries a hardcoded
        # ClusterIP that goes stale whenever the Gateway is recreated —
        # which it did, twice.
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
