server {
    listen 80;
    server_name _;

    # Location headers must be relative. This server always sits behind
    # something that remaps the port or terminates TLS — k3d publishes it
    # on :8080 in solo, Envoy terminates HTTPS in production — and with
    # absolute_redirect on, nginx rebuilds Location from its own :80 and
    # drops the caller's port. Docusaurus emits `page/index.html`, so every
    # link without a trailing slash takes that directory redirect: in solo
    # it lands on http://localhost/page/ and dies, and in production it
    # emits an http:// redirect from an https:// page that only HSTS
    # repairs. See #217.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy /api/* to the validator sidecar running on 127.0.0.1:8081.
    # The two containers share a network namespace (same pod), so localhost works.
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
